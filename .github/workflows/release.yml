name: Release charts

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "artifacthub-repo.yml"
      - "pgp_keys.asc"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # GitHub Releases and the gh-pages index
  packages: write   # OCI charts on GHCR
  id-token: write   # keyless cosign signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: azure/setup-helm@v4

      # Unpack the PGP signing key (Helm provenance, shown as "signed" on Artifact Hub).
      # Public key: pgp_keys.asc in this repo, served at upstreamyard.github.io/helm-charts.
      - name: Prepare chart signing key
        env:
          GPG_KEYRING_BASE64: ${{ secrets.GPG_KEYRING_BASE64 }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          dir="$RUNNER_TEMP/cr-gpg"; mkdir -p "$dir"; chmod 700 "$dir"
          base64 -d <<< "$GPG_KEYRING_BASE64" > "$dir/secring.gpg"
          printf '%s' "$GPG_PASSPHRASE" > "$dir/passphrase"
          echo "CR_KEYRING=$dir/secring.gpg" >> "$GITHUB_ENV"
          echo "CR_PASSPHRASE_FILE=$dir/passphrase" >> "$GITHUB_ENV"

      # Packages and signs changed charts (.prov files), creates a GitHub Release per
      # chart version and updates index.yaml on gh-pages (https://upstreamyard.github.io/helm-charts).
      - name: Release to GitHub Pages
        id: cr
        uses: helm/chart-releaser-action@v1
        with:
          skip_existing: true
        env:
          CR_TOKEN: ${{ github.token }}
          CR_SIGN: "true"
          CR_KEY: upstreamyard Helm charts

      - name: Publish Artifact Hub metadata and public key to gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages gh-pages
          cp artifacthub-repo.yml pgp_keys.asc /tmp/gh-pages/
          cd /tmp/gh-pages
          git add artifacthub-repo.yml pgp_keys.asc
          git diff --cached --quiet || { git commit -m "Update Artifact Hub metadata and public key"; git push origin gh-pages; }

      # Docker login is what cosign reads; helm keeps its own registry login.
      - name: Log in to GHCR (cosign)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to GHCR (helm)
        run: echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: sigstore/cosign-installer@v3

      # Idempotent, so a failed or re-run release catches up: push each chart version
      # that is not on GHCR yet, and sign each one that has no valid signature yet.
      - name: Push to GHCR (OCI) and sign
        env:
          OWNER: ${{ github.repository_owner }}
          IDENTITY: ^https://github.com/${{ github.repository }}/
        run: |
          set -euo pipefail
          repo="ghcr.io/${OWNER,,}/charts"
          for dir in charts/*/; do
            name=$(yq .name "$dir/Chart.yaml"); version=$(yq .version "$dir/Chart.yaml")
            ref="$repo/$name:$version"
            if helm show chart "oci://$repo/$name" --version "$version" >/dev/null 2>&1; then
              echo "$ref already on GHCR"
            else
              helm package "$dir" -d /tmp/oci-packages
              helm push "/tmp/oci-packages/$name-$version.tgz" "oci://$repo"
            fi
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')
            if cosign verify "$repo/$name@$digest" --certificate-identity-regexp "$IDENTITY" \
                 --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null 2>&1; then
              echo "$ref already signed"
            else
              cosign sign --yes "$repo/$name@$digest"
            fi
          done
