name: Release charts

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "artifacthub-repo.yml"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # GitHub Releases and the gh-pages index
  packages: write   # OCI charts on GHCR
  id-token: write   # keyless cosign signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: azure/setup-helm@v4

      # Packages changed charts, creates a GitHub Release per chart version and
      # updates index.yaml on gh-pages (https://upstreamyard.github.io/helm-charts).
      - name: Release to GitHub Pages
        id: cr
        uses: helm/chart-releaser-action@v1
        with:
          skip_existing: true
        env:
          CR_TOKEN: ${{ github.token }}

      - name: Publish Artifact Hub metadata to gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages gh-pages
          cp artifacthub-repo.yml /tmp/gh-pages/artifacthub-repo.yml
          cd /tmp/gh-pages
          git add artifacthub-repo.yml
          git diff --cached --quiet || { git commit -m "Update artifacthub-repo.yml"; git push origin gh-pages; }

      # Docker login is what cosign reads; helm keeps its own registry login.
      - name: Log in to GHCR (cosign)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to GHCR (helm)
        run: echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: sigstore/cosign-installer@v3

      # Idempotent, so a failed or re-run release catches up: push each chart version
      # that is not on GHCR yet, and sign each one that has no valid signature yet.
      - name: Push to GHCR (OCI) and sign
        env:
          OWNER: ${{ github.repository_owner }}
          IDENTITY: ^https://github.com/${{ github.repository }}/
        run: |
          set -euo pipefail
          repo="ghcr.io/${OWNER,,}/charts"
          for dir in charts/*/; do
            name=$(yq .name "$dir/Chart.yaml"); version=$(yq .version "$dir/Chart.yaml")
            ref="$repo/$name:$version"
            if helm show chart "oci://$repo/$name" --version "$version" >/dev/null 2>&1; then
              echo "$ref already on GHCR"
            else
              helm package "$dir" -d /tmp/oci-packages
              helm push "/tmp/oci-packages/$name-$version.tgz" "oci://$repo"
            fi
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')
            if cosign verify "$repo/$name@$digest" --certificate-identity-regexp "$IDENTITY" \
                 --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null 2>&1; then
              echo "$ref already signed"
            else
              cosign sign --yes "$repo/$name@$digest"
            fi
          done
