name: Lint and test charts

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Job name is the required status check for auto-merge; keep it stable.
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: helm/chart-testing-action@v2

      - name: Changed charts
        id: changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          echo "$changed"
          if [ -n "$changed" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Chart READMEs are up to date (helm-docs)
        run: |
          docker run --rm -v "$PWD:/helm-docs" -u "$(id -u)" jnorwood/helm-docs:latest --chart-search-root charts
          git diff --exit-code -- 'charts/*/README.md' || {
            echo "::error::Chart README out of date. Run helm-docs --chart-search-root charts and commit."; exit 1; }

      - name: Lint
        if: steps.changed.outputs.changed == 'true'
        run: ct lint --config ct.yaml

      - name: Create kind cluster
        if: steps.changed.outputs.changed == 'true'
        uses: helm/kind-action@v1

      # Shared PostgreSQL and Redis, plus .github/ci/deps/<chart>.yaml for each changed chart.
      - name: Deploy test dependencies
        if: steps.changed.outputs.changed == 'true'
        run: |
          kubectl apply -f .github/ci/deps/shared.yaml
          for chart in $(ct list-changed --config ct.yaml); do
            deps=".github/ci/deps/${chart#charts/}.yaml"
            if [ -f "$deps" ]; then kubectl apply -f "$deps"; fi
          done
          kubectl -n deps wait deployment --all --for=condition=Available --timeout=300s
          if [ -n "$(kubectl -n deps get jobs -o name)" ]; then
            kubectl -n deps wait job --all --for=condition=Complete --timeout=300s
          fi

      # Installs each changed chart once per ci/*-values.yaml file, waits until it is
      # ready (incl. the migration hook) and runs `helm test`.
      - name: Install and test
        if: steps.changed.outputs.changed == 'true'
        run: ct install --config ct.yaml
