# Throwaway databases for chart tests in kind: PostgreSQL with pgvector and Redis (aegra), MySQL 8.4 (xxl-job).
# Not for production. Referenced by charts/*/ci/*-values.yaml as *.deps.svc.
apiVersion: v1
kind: Namespace
metadata:
  name: deps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: deps
spec:
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg18
          env:
            - { name: POSTGRES_USER, value: aegra }
            - { name: POSTGRES_PASSWORD, value: aegra }
            - { name: POSTGRES_DB, value: aegra }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aegra", "-d", "aegra"]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: deps
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: deps
spec:
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: deps
spec:
  selector: { app: redis }
  ports:
    - port: 6379
---
# MySQL 8.4 for the xxl-job chart: an empty database "xxl_job" and a non-root user.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xxl-job-mysql
  namespace: deps
spec:
  selector:
    matchLabels: { app: xxl-job-mysql }
  template:
    metadata:
      labels: { app: xxl-job-mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - { name: MYSQL_ROOT_PASSWORD, value: rootpw }
            - { name: MYSQL_DATABASE, value: xxl_job }
            - { name: MYSQL_USER, value: xxljob }
            - { name: MYSQL_PASSWORD, value: xxljob }
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
          ports:
            - containerPort: 3306
          readinessProbe:
            # Over TCP: MySQL's first-start initialization runs without networking.
            exec:
              command: ["mysql", "-h", "127.0.0.1", "-uxxljob", "-pxxljob", "-e", "USE xxl_job"]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: xxl-job-mysql
  namespace: deps
spec:
  selector: { app: xxl-job-mysql }
  ports:
    - port: 3306
