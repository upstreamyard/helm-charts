# Throwaway PostgreSQL (with pgvector), Redis and a mock OpenAI-compatible LLM for chart
# tests in kind. Not for production. Referenced by charts/*/ci/*-values.yaml as *.deps.svc.
apiVersion: v1
kind: Namespace
metadata:
  name: deps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: deps
spec:
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg18
          env:
            - { name: POSTGRES_USER, value: aegra }
            - { name: POSTGRES_PASSWORD, value: aegra }
            - { name: POSTGRES_DB, value: aegra }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aegra", "-d", "aegra"]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: deps
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: deps
spec:
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: deps
spec:
  selector: { app: redis }
  ports:
    - port: 6379
---
# Answers OpenAI chat completions with "mock reply from <model>", so charts of LLM
# gateways can be tested without API keys.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-llm
  namespace: deps
data:
  mock_llm.py: |
    """Minimal OpenAI-compatible server for testing Plano. Answers every chat completion
    with "mock reply from <model>". Streams when asked; a message containing "slow" streams
    one chunk per second for 10 seconds."""
    import json, time
    from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
    
    
    class H(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"
    
        def log_message(self, fmt, *args):
            print("mock-llm", self.command, self.path, self.headers.get("authorization", "")[:20], flush=True)
    
        def do_GET(self):
            body = json.dumps({"object": "list", "data": [{"id": "mock-model", "object": "model"}]}).encode()
            self.send_response(200)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
    
        def do_POST(self):
            if self.headers.get("transfer-encoding", "").lower() == "chunked":
                raw = b""
                while True:
                    size = int(self.rfile.readline().strip().split(b";")[0], 16)
                    if size == 0:
                        self.rfile.readline()
                        break
                    raw += self.rfile.read(size)
                    self.rfile.readline()
            else:
                raw = self.rfile.read(int(self.headers.get("content-length", 0)))
            req = json.loads(raw or b"{}")
            model = req.get("model", "unknown")
            text = json.dumps(req.get("messages", []))
            reply = f"mock reply from {model}"
            if req.get("stream"):
                self.send_response(200)
                self.send_header("content-type", "text/event-stream")
                self.send_header("transfer-encoding", "chunked")
                self.end_headers()
                n = 10 if "slow" in text else 3
                for i in range(n):
                    chunk = {"id": "c1", "object": "chat.completion.chunk", "created": int(time.time()), "model": model,
                             "choices": [{"index": 0, "delta": {"content": f"{reply} {i} "}, "finish_reason": None}]}
                    self._chunk(f"data: {json.dumps(chunk)}\n\n")
                    if "slow" in text:
                        time.sleep(1)
                done = {"id": "c1", "object": "chat.completion.chunk", "created": int(time.time()), "model": model,
                        "choices": [{"index": 0, "delta": {}, "finish_reason": "stop"}],
                        "usage": {"prompt_tokens": 5, "completion_tokens": n, "total_tokens": 5 + n}}
                self._chunk(f"data: {json.dumps(done)}\n\ndata: [DONE]\n\n")
                self._chunk("")
                return
            body = json.dumps({"id": "c1", "object": "chat.completion", "created": int(time.time()), "model": model,
                               "choices": [{"index": 0, "message": {"role": "assistant", "content": reply}, "finish_reason": "stop"}],
                               "usage": {"prompt_tokens": 5, "completion_tokens": 4, "total_tokens": 9}}).encode()
            self.send_response(200)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
    
        def _chunk(self, s):
            b = s.encode()
            self.wfile.write(f"{len(b):x}\r\n".encode() + b + b"\r\n")
            self.wfile.flush()
    
    
    ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  namespace: deps
spec:
  selector:
    matchLabels: { app: mock-llm }
  template:
    metadata:
      labels: { app: mock-llm }
    spec:
      containers:
        - name: mock-llm
          image: python:3.13-alpine
          command: ["python", "-u", "/mock/mock_llm.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /v1/models, port: 8080 }
            periodSeconds: 2
          volumeMounts:
            - { name: mock, mountPath: /mock }
      volumes:
        - name: mock
          configMap: { name: mock-llm }
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  namespace: deps
spec:
  selector: { app: mock-llm }
  ports:
    - port: 8080
