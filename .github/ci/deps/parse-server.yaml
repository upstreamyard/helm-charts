# Test services for the parse-server chart in kind; CI starts them when the chart changes. Not for production.
# MongoDB for the parse-server chart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: deps
spec:
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          # 8.2: MongoDB 8.0 refuses to start on Linux 6.19+ (SERVER-121912).
          image: mongo:8.2
          ports:
            - containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: deps
spec:
  selector: { app: mongo }
  ports:
    - port: 27017