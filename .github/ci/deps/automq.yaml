# S3-compatible object storage for the automq chart (pgsty/silo, a maintained MinIO build;
# MinIO's own images are no longer published). Bucket "automq" is created by the Job below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
  namespace: deps
spec:
  selector:
    matchLabels: { app: s3 }
  template:
    metadata:
      labels: { app: s3 }
    spec:
      containers:
        - name: s3
          image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
          args: ["server", "/data"]
          env:
            - { name: MINIO_ROOT_USER, value: ci-access-key }
            - { name: MINIO_ROOT_PASSWORD, value: ci-secret-key }
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: deps
spec:
  selector: { app: s3 }
  ports:
    - port: 9000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-buckets
  namespace: deps
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
          command: ["/bin/sh", "-ec"]
          args:
            - mc alias set s3 http://s3.deps.svc:9000 ci-access-key ci-secret-key && mc mb --ignore-existing s3/automq
