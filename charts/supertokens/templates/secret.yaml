{{- include "supertokens.validate" . }}
{{- if include "supertokens.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "supertokens.fullname" . }}
  labels:
    {{- include "supertokens.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "supertokens.secretData" . | nindent 2 }}
{{- end }}
