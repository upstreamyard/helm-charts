apiVersion: v2
name: krakend
description: KrakenD Helm chart for Kubernetes. KrakenD 3 Community Edition API gateway on the official image, with flexible configuration (templates, settings, secrets from environment variables), config linting before rollout, zero-downtime rolling upgrades, Prometheus metrics, TLS, HPA, Gateway API HTTPRoute and a non-root, read-only default. Community chart by upstreamyard, not an official KrakenD chart.
type: application
version: 0.1.0
appVersion: "3.0.5"
kubeVersion: ">=1.25.0-0"
home: https://github.com/upstreamyard/helm-charts/tree/main/charts/krakend
icon: https://upstreamyard.github.io/helm-charts/logo.png
