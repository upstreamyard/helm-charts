  - https://github.com/krakend/krakend-ce
keywords:
  - krakend
  - krakend-ce
  - api-gateway
  - api-management
  - gateway
  - backend-for-frontend
  - bff
  - rate-limiting
  - jwt
  - reverse-proxy
  - lura
maintainers:
