{{- include "krakend.validate" . }}
{{- if not .Values.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "krakend.fullname" . }}
  labels:
    {{- include "krakend.labels" . | nindent 4 }}
data:
  {{- if .Values.flexibleConfig.enabled }}
  krakend.tmpl: |
    {{- .Values.flexibleConfig.template | nindent 4 }}
  {{- else }}
  krakend.json: |
    {{- include "krakend.config" . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.flexibleConfig.enabled .Values.flexibleConfig.settings (not .Values.flexibleConfig.existingSettingsConfigMap) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "krakend.fullname" . }}-settings
  labels:
    {{- include "krakend.labels" . | nindent 4 }}
data:
  {{- range $name, $settings := .Values.flexibleConfig.settings }}
  {{ $name }}.json: |
    {{- toPrettyJson $settings | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.flexibleConfig.enabled .Values.flexibleConfig.partials (not .Values.flexibleConfig.existingPartialsConfigMap) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "krakend.fullname" . }}-partials
  labels:
    {{- include "krakend.labels" . | nindent 4 }}
data:
  {{- range $file, $content := .Values.flexibleConfig.partials }}
  {{ $file }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.flexibleConfig.enabled .Values.flexibleConfig.templates (not .Values.flexibleConfig.existingTemplatesConfigMap) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "krakend.fullname" . }}-templates
  labels:
    {{- include "krakend.labels" . | nindent 4 }}
data:
  {{- range $file, $content := .Values.flexibleConfig.templates }}
  {{ $file }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
