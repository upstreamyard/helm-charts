{{- if include "krakend.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "krakend.fullname" . }}
  labels:
    {{- include "krakend.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ toString $v | b64enc | quote }}
  {{- end }}
{{- end }}
