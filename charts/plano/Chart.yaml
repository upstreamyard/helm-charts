apiVersion: v2
name: plano
description: Plano Helm chart for Kubernetes. Plano (formerly archgw) is an AI gateway and LLM proxy built on Envoy, with one OpenAI-compatible API for OpenAI, Anthropic, Gemini, Amazon Bedrock, Azure OpenAI, Ollama and other providers, plus model routing, guardrails and agent orchestration. Runs the official image as non-root on a read-only filesystem without internet access at startup, keeps provider API keys away from the Envoy admin API, scales out with PostgreSQL conversation state and a Redis session cache, and ships Prometheus metrics, NetworkPolicy and helm test. Community chart by upstreamyard, not an official Plano chart.
type: application
version: 0.1.4
appVersion: "0.4.39"
kubeVersion: ">=1.25.0-0"
