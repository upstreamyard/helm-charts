apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cube.fullname" . }}-api
  labels:
    {{- include "cube.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "cube.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    {{- include "cube.cubePod" (list . "api") | nindent 4 }}
