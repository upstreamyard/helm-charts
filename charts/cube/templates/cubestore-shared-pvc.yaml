{{- if and .Values.cubestore.enabled (eq .Values.cubestore.storage.type "sharedVolume") .Values.cubestore.storage.sharedVolume.create }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cube.sharedClaim" . }}
  labels:
    {{- include "cube.labels" . | nindent 4 }}
    app.kubernetes.io/component: cubestore
spec:
  accessModes:
    {{- toYaml .Values.cubestore.storage.sharedVolume.accessModes | nindent 4 }}
  {{- with .Values.cubestore.storage.sharedVolume.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.cubestore.storage.sharedVolume.size }}
{{- end }}
