{{- if not .Values.model.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cube.modelConfigMap" . }}
  labels:
    {{- include "cube.labels" . | nindent 4 }}
data:
  {{- range $name, $content := .Values.model.files }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
