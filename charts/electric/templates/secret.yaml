{{- include "electric.validate" . }}
{{- if include "electric.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "electric.fullname" . }}
  labels:
    {{- include "electric.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "electric.secretData" . | nindent 2 }}
{{- end }}
