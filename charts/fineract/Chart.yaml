apiVersion: v2
name: fineract
description: Apache Fineract Helm chart for Kubernetes. Open-source core banking platform (loans, savings, accounting) with database migrations in a Job, scalable write, read and batch instances, generated admin password instead of mifos/password, TLS with cert-manager, Prometheus metrics, PostgreSQL or MariaDB. Community chart by upstreamyard, not an official Apache Fineract chart.
type: application
version: 0.1.0
appVersion: "1.16.1"
kubeVersion: ">=1.25.0-0"
home: https://github.com/upstreamyard/helm-charts/tree/main/charts/fineract
icon: https://upstreamyard.github.io/helm-charts/logo.png
sources:
  - https://github.com/upstreamyard/helm-charts
  - https://github.com/upstreamyard/fineract
  - https://github.com/apache/fineract
keywords:
  - fineract
  - apache-fineract
  - mifos
  - core-banking
  - banking
  - microfinance
  - fintech
  - loans
  - savings
  - accounting
maintainers:
  - name: upstreamyard
    url: https://github.com/upstreamyard
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: fineract
      image: upstreamyard/fineract:1.16.1
  artifacthub.io/links: |
    - name: Apache Fineract
      url: https://github.com/apache/fineract
    - name: Container image
      url: https://github.com/upstreamyard/fineract
  artifacthub.io/signKey: |
    fingerprint: 9B416F989B7E6C65F7F3BFAE7689688B20EC7813
    url: https://upstreamyard.github.io/helm-charts/pgp_keys.asc
  artifacthub.io/changes: |
    - kind: added
      description: First release of the Apache Fineract chart (Fineract 1.16.1)
