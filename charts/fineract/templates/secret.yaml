{{- include "fineract.validate" . }}
{{- if include "fineract.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fineract.fullname" . }}
  labels:
    {{- include "fineract.labels" . | nindent 4 }}
  annotations:
    # The generated admin password only takes effect on the first start; losing it with the
    # release would leave the database with a password nobody knows.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- include "fineract.secretData" (list . false) | trim | nindent 2 }}
{{- end }}
