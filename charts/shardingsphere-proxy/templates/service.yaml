apiVersion: v1
kind: Service
metadata:
  name: {{ include "shardingsphere-proxy.fullname" . }}
  labels:
    {{- include "shardingsphere-proxy.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: proxy
      port: {{ .Values.service.port }}
      targetPort: proxy
      protocol: TCP
  selector:
    {{- include "shardingsphere-proxy.selectorLabels" . | nindent 4 }}
