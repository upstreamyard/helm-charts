{{- include "shardingsphere-proxy.validate" . }}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shardingsphere-proxy.fullname" . }}
  labels:
    {{- include "shardingsphere-proxy.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "shardingsphere-proxy.secretData" . | nindent 2 }}
{{- end }}
