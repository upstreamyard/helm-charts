apiVersion: v2
name: shardingsphere-proxy
description: Apache ShardingSphere-Proxy, the database proxy for sharding, read/write splitting, encryption and masking in front of MySQL and PostgreSQL. Community chart by upstreamyard, not an official Apache ShardingSphere chart.
type: application
version: 0.1.2
appVersion: "5.5.3"
kubeVersion: ">=1.25.0-0"
home: https://github.com/upstreamyard/helm-charts
icon: https://upstreamyard.github.io/helm-charts/logo.png
sources:
  - https://github.com/upstreamyard/helm-charts
  - https://github.com/upstreamyard/shardingsphere-proxy
  - https://github.com/apache/shardingsphere
keywords:
  - shardingsphere
  - sharding
  - database-proxy
  - mysql
  - postgresql
  - read-write-splitting
maintainers:
