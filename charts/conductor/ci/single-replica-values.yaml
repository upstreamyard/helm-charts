# Used by chart-testing (ct install) in CI. PostgreSQL 16 is deployed into the
# "deps" namespace by the workflow before the chart is installed.
database:
  url: jdbc:postgresql://conductor-postgres.deps.svc:5432/conductor
  username: conductor
  password: conductor
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1536Mi
