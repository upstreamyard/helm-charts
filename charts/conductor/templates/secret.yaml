{{- include "conductor.validate" . }}
{{- if include "conductor.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conductor.fullname" . }}
  labels:
    {{- include "conductor.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "conductor.secretData" . | nindent 2 }}
{{- end }}
