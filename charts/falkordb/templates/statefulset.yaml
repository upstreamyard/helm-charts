{{- include "falkordb.validate" . }}
{{- $replication := include "falkordb.replication" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "falkordb.fullname" . }}
  labels:
    {{- include "falkordb.labels" . | nindent 4 }}
spec:
  replicas: {{ include "falkordb.replicas" . }}
  serviceName: {{ include "falkordb.headlessName" . }}
  # Pods start together after a full outage; each finds the primary by itself.
  podManagementPolicy: Parallel
  # Gives Sentinel time to see a restarted replica before the next pod is replaced.
  minReadySeconds: {{ ternary 10 0 (not (empty $replication)) }}
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "falkordb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "falkordb.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "falkordb.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: falkordb
          image: {{ include "falkordb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/scripts/start-falkordb.sh"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "falkordb.commonEnv" . | nindent 12 }}
            - name: ARCHITECTURE
              value: {{ .Values.architecture | quote }}
            - name: FALKORDB_ARGS
              value: {{ include "falkordb.args" . | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: falkordb
              containerPort: 6379
          startupProbe:
            exec:
              command: ["/scripts/probe.sh", "ready"]
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/scripts/probe.sh", "live"]
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["/scripts/probe.sh", "ready"]
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            timeoutSeconds: 5
          {{- if $replication }}
          lifecycle:
            preStop:
              exec:
                command: ["/scripts/prestop-falkordb.sh"]
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/falkordb/data
            - name: scripts
              mountPath: /scripts
            - name: config
              mountPath: /config
            - name: run
              mountPath: /run/falkordb
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if $replication }}
        - name: sentinel
          image: {{ include "falkordb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/scripts/start-sentinel.sh"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "falkordb.commonEnv" . | nindent 12 }}
            - name: QUORUM
              value: {{ include "falkordb.quorum" . | quote }}
            - name: DOWN_AFTER_MILLISECONDS
              value: {{ .Values.sentinel.downAfterMilliseconds | quote }}
            - name: FAILOVER_TIMEOUT
              value: {{ .Values.sentinel.failoverTimeout | quote }}
          ports:
            - name: sentinel
              containerPort: 26379
          startupProbe:
            exec:
              command: ["sh", "-c", "timeout 3 redis-cli --no-auth-warning -p 26379 PING | grep -q PONG"]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["sh", "-c", "timeout 3 redis-cli --no-auth-warning -p 26379 PING | grep -q PONG"]
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "timeout 3 redis-cli --no-auth-warning -p 26379 PING | grep -q PONG"]
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/scripts/prestop-sentinel.sh"]
          {{- with .Values.sentinel.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: config
              mountPath: /config
            # Sentinel's state (sentinel.conf) lives next to FalkorDB's data.
            - name: data
              mountPath: /var/lib/falkordb/data
        {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: metrics
          image: {{ printf "%s:%s" .Values.metrics.image.repository .Values.metrics.image.tag }}
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
            {{- if .Values.auth.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "falkordb.secretName" . }}
                  key: {{ include "falkordb.secretKey" . }}
            {{- end }}
            {{- with .Values.metrics.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 9121
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 10
          {{- with .Values.metrics.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        - name: scripts
          configMap:
            name: {{ include "falkordb.fullname" . }}
            defaultMode: 0555
            items:
              - {key: common.sh, path: common.sh}
              - {key: start-falkordb.sh, path: start-falkordb.sh}
              - {key: start-sentinel.sh, path: start-sentinel.sh}
              - {key: probe.sh, path: probe.sh}
              - {key: prestop-falkordb.sh, path: prestop-falkordb.sh}
              - {key: prestop-sentinel.sh, path: prestop-sentinel.sh}
        - name: config
          configMap:
            name: {{ include "falkordb.fullname" . }}
            items:
              - {key: falkordb.conf, path: falkordb.conf}
              - {key: sentinel.conf, path: sentinel.conf}
        # The generated FalkorDB config file (it contains the password).
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if and $replication .Values.podAntiAffinityPreset }}
      affinity:
        podAntiAffinity:
          {{- if eq .Values.podAntiAffinityPreset "hard" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "falkordb.selectorLabels" . | nindent 18 }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "falkordb.selectorLabels" . | nindent 20 }}
          {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
