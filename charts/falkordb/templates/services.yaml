apiVersion: v1
kind: Service
metadata:
  name: {{ include "falkordb.fullname" . }}
  labels:
    {{- include "falkordb.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "falkordb.selectorLabels" . | nindent 4 }}
  ports:
    # With replication, this port reaches any ready pod: use it for read-only queries
    # (GRAPH.RO_QUERY), and Sentinel for writes.
    - name: falkordb
      port: 6379
      targetPort: falkordb
    {{- if include "falkordb.replication" . }}
    - name: sentinel
      port: 26379
      targetPort: sentinel
    {{- end }}
---
# Stable DNS names per pod (<pod>.<this service>), announced to Sentinel and clients.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "falkordb.headlessName" . }}
  labels:
    {{- include "falkordb.labels" . | nindent 4 }}
    app.kubernetes.io/component: headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "falkordb.selectorLabels" . | nindent 4 }}
  ports:
    - name: falkordb
      port: 6379
      targetPort: falkordb
    {{- if include "falkordb.replication" . }}
    - name: sentinel
      port: 26379
      targetPort: sentinel
    {{- end }}
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: 9121
      targetPort: metrics
    {{- end }}
