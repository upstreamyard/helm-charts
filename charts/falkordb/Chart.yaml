apiVersion: v2
name: falkordb
description: FalkorDB Helm chart for Kubernetes. Graph database (openCypher, GraphRAG, knowledge graphs for AI agents) on the official falkordb-server image, as a single instance or highly available with replication and Redis Sentinel failover, password auth by default, AOF persistence, non-root, Prometheus metrics and helm test. Community chart by upstreamyard, not an official FalkorDB chart. FalkorDB is licensed under SSPL-1.0.
type: application
version: 0.1.3
appVersion: "6.0.3"
kubeVersion: ">=1.25.0-0"
home: https://github.com/upstreamyard/helm-charts/tree/main/charts/falkordb
icon: https://upstreamyard.github.io/helm-charts/logo.png
sources:
  - https://github.com/upstreamyard/helm-charts
  - https://github.com/FalkorDB/FalkorDB
keywords:
  - falkordb
  - graph-database
  - graphdb
  - cypher
  - opencypher
  - knowledge-graph
  - graphrag
  - redis-sentinel
  - high-availability
  - database
maintainers:
  - name: upstreamyard
    url: https://github.com/upstreamyard
annotations:
  artifacthub.io/category: database
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: falkordb-server
      image: falkordb/falkordb-server:6.0.3
  artifacthub.io/links: |
    - name: FalkorDB
      url: https://github.com/FalkorDB/FalkorDB
  artifacthub.io/signKey: |
    fingerprint: 9B416F989B7E6C65F7F3BFAE7689688B20EC7813
    url: https://upstreamyard.github.io/helm-charts/pgp_keys.asc
  artifacthub.io/changes: |
    - kind: added
      description: Support contact in the README
