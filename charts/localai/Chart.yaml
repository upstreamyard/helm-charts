apiVersion: v2
name: localai
description: LocalAI Helm chart for Kubernetes. Self-hosted OpenAI-compatible API for LLMs, embeddings, images, speech and agents on CPU or GPU (NVIDIA CUDA, AMD ROCm, Intel, Vulkan), as a single server or in distributed mode with scalable frontends and GPU workers on PostgreSQL and NATS. API key by default, admin account created on install, non-root, Prometheus metrics. Community chart by upstreamyard, not an official LocalAI chart.
type: application
version: 0.1.1
appVersion: "4.12.1"
kubeVersion: ">=1.25.0-0"
home: https://github.com/upstreamyard/helm-charts/tree/main/charts/localai
icon: https://upstreamyard.github.io/helm-charts/logo.png
sources:
  - https://github.com/upstreamyard/helm-charts
  - https://github.com/mudler/LocalAI
keywords:
