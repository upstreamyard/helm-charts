{{- include "localai.validate" . }}
{{- if include "localai.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "localai.secretName" . }}
  labels:
    {{- include "localai.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall: user API keys and sessions (in the volume or PostgreSQL) depend on the
    # HMAC secret, and a reinstall with the same release name picks the generated values up again.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if include "localai.createApiKey" . }}
  api-key: {{ include "localai.secretValue" (list . "api-key" .Values.apiKey.value 48) | b64enc | quote }}
  {{- end }}
  {{- if include "localai.createAuthSecrets" . }}
  hmac-secret: {{ include "localai.secretValue" (list . "hmac-secret" .Values.auth.hmacSecret 64) | b64enc | quote }}
  {{- if .Values.auth.admin.email }}
  admin-password: {{ include "localai.secretValue" (list . "admin-password" .Values.auth.admin.password 32) | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if include "localai.createRegistrationToken" . }}
  registration-token: {{ include "localai.secretValue" (list . "registration-token" .Values.distributed.registrationToken 48) | b64enc | quote }}
  {{- end }}
  {{- if include "localai.createDatabaseUrl" . }}
  database-url: {{ .Values.database.url | b64enc | quote }}
  {{- end }}
  {{- if include "localai.createNatsUrl" . }}
  nats-url: {{ .Values.distributed.nats.url | b64enc | quote }}
  {{- end }}
{{- end }}
