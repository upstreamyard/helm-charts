apiVersion: v1
kind: Pod
metadata:
  name: {{ include "aegra.fullname" . }}-test-ready
  labels:
    {{- include "aegra.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: curl
      # The Aegra image already contains curl, so no extra image is pulled.
      image: {{ include "aegra.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["curl", "-sf", "--retry", "10", "--retry-all-errors", "--retry-delay", "3",
                "http://{{ include "aegra.fullname" . }}:{{ .Values.service.port }}/ready"]
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
