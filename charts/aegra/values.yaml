# -- Number of Aegra pods. More than 1 requires `redis` (Aegra needs Redis to share streaming and the job queue).
replicaCount: 1

image:
  # -- Image repository. To serve your own agents, use your own image built `FROM upstreamyard/aegra` (see "Running your own agents").
  repository: upstreamyard/aegra
  # -- Image tag. Defaults to the chart's appVersion.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Secrets for pulling from a private registry.
imagePullSecrets: []
# -- Override the chart name in resource names.
nameOverride: ""
# -- Override the full resource name.
fullnameOverride: ""

# PostgreSQL connection. Required. PostgreSQL must include the pgvector extension
# (e.g. the pgvector/pgvector:pg18 image), as stated in Aegra's docs.
database:
  # -- Connection string `postgresql://user:password@host:5432/db`. URL-encode special characters in the password. Stored in a Secret created by this chart. Ignored when `existingSecret` is set.
  url: ""
  # -- Name of an existing Secret that holds the connection string (recommended for production).
  existingSecret: ""
  # -- Key in `existingSecret` that holds the connection string.
  existingSecretKey: database-url

# Redis connection. Optional for 1 replica, required for more. When set, the chart sets REDIS_BROKER_ENABLED=true.
redis:
  # -- Redis URL, e.g. `redis://redis:6379/0`. Stored in a Secret created by this chart. Ignored when `existingSecret` is set.
  url: ""
  # -- Name of an existing Secret that holds the Redis URL.
  existingSecret: ""
  # -- Key in `existingSecret` that holds the Redis URL.
  existingSecretKey: redis-url

migrations:
  # -- Run `aegra db upgrade` in a Job before every install and upgrade (Helm hook), and disable migrations on pod startup. This is the approach Aegra's docs recommend for Kubernetes. If false, each pod migrates on startup, which is fine for a single replica.
  enabled: true
  # -- Retries of the migration Job before the install/upgrade fails.
  backoffLimit: 3
  # -- Maximum runtime of the migration Job in seconds.
  activeDeadlineSeconds: 600
  # -- Resources for the migration Job.
  resources: {}

# -- Extra environment variables for Aegra, e.g. `ENV_MODE`, `LOG_LEVEL`, OTEL settings. See https://github.com/aegra/aegra/blob/main/.env.example
extraEnv: []
# - name: LOG_LEVEL
#   value: DEBUG

# -- Extra environment variables from Secrets or ConfigMaps, e.g. a Secret with LLM keys or credentials your agents use.
extraEnvFrom: []
# - secretRef:
#     name: llm-api-keys

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port. Aegra listens on 2026 inside the container.
  port: 2026

ingress:
  # -- Create an Ingress.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Ingress annotations.
  annotations: {}
  # -- Ingress hosts and paths.
  hosts:
    - host: aegra.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration.
  tls: []

serviceAccount:
  # -- Create a ServiceAccount.
  create: true
  # -- Mount the ServiceAccount token. Aegra does not use the Kubernetes API.
  automount: false
  # -- ServiceAccount annotations.
  annotations: {}
  # -- ServiceAccount name. Generated from the full name if empty.
  name: ""

# -- Seconds Kubernetes waits after SIGTERM. Aegra's docs: a few seconds above `WORKER_DRAIN_TIMEOUT` (default 30) so running agent runs can finish.
terminationGracePeriodSeconds: 35

# -- Startup probe. `/live` checks only that the process is up.
startupProbe:
  httpGet:
    path: /live
    port: http
  periodSeconds: 2
  failureThreshold: 30
# -- Liveness probe on `/live`, as in Aegra's docs.
livenessProbe:
  httpGet:
    path: /live
    port: http
  periodSeconds: 10
# -- Readiness probe on `/ready` (503 until the database and LangGraph backends respond), as in Aegra's docs.
readinessProbe:
  httpGet:
    path: /ready
    port: http
  periodSeconds: 5
  failureThreshold: 3

# -- Resources for the Aegra container.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

# -- Pod security context. The image runs as non-root UID 10001.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# -- Container security context.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# -- Extra pod annotations.
podAnnotations: {}
# -- Extra pod labels.
podLabels: {}
# -- Node selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity.
affinity: {}
