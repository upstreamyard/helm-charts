# 3 controller-only nodes and 2 broker-only nodes, no authentication.
s3:
  dataBucket: automq
  endpoint: http://s3.deps.svc:9000
  pathStyle: true
  accessKey: ci-access-key
  secretKey: ci-secret-key
auth:
  enabled: false
controller:
  controllerOnly: true
  heapOpts: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m"
  resources:
    requests:
      cpu: 100m
      memory: 1536Mi
    limits:
      memory: 1536Mi
  persistence:
    size: 1Gi
broker:
  replicas: 2
  heapOpts: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m"
  resources:
    requests:
      cpu: 100m
      memory: 1536Mi
    limits:
      memory: 1536Mi
