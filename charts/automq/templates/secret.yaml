{{- include "automq.validate" . }}
{{- if include "automq.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "automq.secretName" . }}
  labels:
    {{- include "automq.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and (eq .Values.s3.authType "static") (not .Values.s3.existingSecret) }}
  s3-access-key: {{ .Values.s3.accessKey | b64enc | quote }}
  s3-secret-key: {{ .Values.s3.secretKey | b64enc | quote }}
  {{- end }}
  {{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
  inter-broker-password: {{ include "automq.password" (list . "inter-broker-password" .Values.auth.interBrokerPassword) | b64enc | quote }}
  {{- range .Values.auth.users }}
  {{ printf "user-%s" .name }}: {{ include "automq.password" (list $ (printf "user-%s" .name) .password) | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
