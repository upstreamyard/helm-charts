{{- if and .Values.podDisruptionBudget.enabled (include "otari.scaled" .) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "otari.fullname" . }}
  labels:
    {{- include "otari.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "otari.serverSelectorLabels" . | nindent 6 }}
{{- end }}
