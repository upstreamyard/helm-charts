{{- include "otari.validate" . }}
{{- $data := include "otari.secretData" (list . false) | trim }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "otari.fullname" . }}
  labels:
    {{- include "otari.labels" . | nindent 4 }}
  annotations:
    # The generated keys must survive an uninstall: OTARI_SECRET_KEY decrypts the provider
    # credentials stored in the database.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- $data | nindent 2 }}
{{- end }}
