{{- include "dolt.validate" . }}
{{- $ha := include "dolt.ha" . }}
{{- $secret := include "dolt.secretName" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dolt.fullname" . }}
  labels:
    {{- include "dolt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "dolt.headlessName" . }}
  # Servers start together: a standby doesn't wait for the primary.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  {{- if $ha }}
  # A rolling update waits this long after each restarted pod is Ready before stopping the
  # next one. A primary sends users and grants to a standby that was down with growing
  # retry intervals, and its handover waits until every standby has them.
  minReadySeconds: {{ .Values.cluster.minReadySeconds }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dolt.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dolt.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dolt.serviceAccountName" . }}
      # Only the role labeler gets a token (projected below), the database container doesn't.
      automountServiceAccountToken: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: dolt
          image: {{ include "dolt.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "/etc/dolt/start.sh"]
          workingDir: /var/lib/dolt
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HOME
              value: /home/dolt
            - name: DOLT_ROOT_PATH
              value: /home/dolt
            # root@'%' with this password is created on the first start (no privileges.db yet).
            - name: DOLT_ROOT_HOST
              value: "%"
            - name: DOLT_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ include "dolt.rootPasswordKey" . }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: mysql
              containerPort: 3306
            {{- if $ha }}
            - name: remotesapi
              containerPort: 50051
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: 11228
            {{- end }}
          {{- if and $ha .Values.cluster.handoverOnShutdown }}
          lifecycle:
            preStop:
              exec:
                # A stopping primary hands its role to a standby first, so a rolling update
                # or node drain only interrupts writes until the Service follows.
                command: ["/bin/bash", "-c", "/etc/dolt/promote.sh --handover >/proc/1/fd/1 2>&1 || true"]
          {{- end }}
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            timeoutSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/dolt
              subPath: databases
            # Dolt's global config, which also holds the server's cluster role and epoch.
            - name: data
              mountPath: /home/dolt
              subPath: home
            - name: config
              mountPath: /etc/dolt
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if $ha }}
        - name: role-labeler
          image: {{ include "dolt.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "/etc/dolt/role-labeler.sh"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOME
              value: /tmp
            - name: DOLT_ROOT_PATH
              value: /tmp
            - name: DOLT_CLI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ include "dolt.rootPasswordKey" . }}
          {{- with .Values.cluster.roleLabeler.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/dolt
              readOnly: true
            - name: labeler-tmp
              mountPath: /tmp
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dolt.fullname" . }}
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
        {{- if $ha }}
        - name: labeler-tmp
          emptyDir: {}
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        {{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if and $ha .Values.podAntiAffinityPreset }}
      affinity:
        podAntiAffinity:
          {{- if eq .Values.podAntiAffinityPreset "hard" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "dolt.selectorLabels" . | nindent 18 }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "dolt.selectorLabels" . | nindent 20 }}
          {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  # Scaled-down standbys' volumes are deleted: kept, they would come back later with an old
  # role and stale data.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.persistence.retainOnUninstall | ternary "Retain" "Delete" }}
    whenScaled: Delete
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
