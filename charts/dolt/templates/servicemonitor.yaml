{{- if .Values.metrics.serviceMonitor.enabled }}
# Scrapes every server through the headless Service, standbys included.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "dolt.fullname" . }}
  labels:
    {{- include "dolt.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "dolt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: headless
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
