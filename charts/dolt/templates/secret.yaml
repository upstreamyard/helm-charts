{{- include "dolt.validate" . }}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dolt.fullname" . }}
  labels:
    {{- include "dolt.labels" . | nindent 4 }}
type: Opaque
data:
  root-password: {{ include "dolt.password" (list . "root-password" .Values.auth.rootPassword) | b64enc | quote }}
  {{- if .Values.auth.username }}
  user-password: {{ include "dolt.password" (list . "user-password" .Values.auth.password) | b64enc | quote }}
  {{- end }}
{{- end }}
