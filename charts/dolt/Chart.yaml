apiVersion: v2
name: dolt
description: Dolt Helm chart for Kubernetes. The version-controlled, MySQL-compatible SQL database (branch, merge, diff and clone your data like Git) with high availability through primary/standby replication, failover, Prometheus metrics and generated passwords. Community chart by upstreamyard, not an official Dolt chart.
