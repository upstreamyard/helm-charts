# -- Number of servers. 1: a single server. 2 or more: primary/standby cluster replication, where server 0 starts as the primary and the others are read-only standbys that receive every commit. Changing it later restarts all servers.
replicaCount: 1

image:
  # -- Image repository. The default is DoltHub's official image.
  repository: dolthub/dolt-sql-server
  # -- Image tag. Defaults to the chart's appVersion.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Secrets for pulling from a private registry.
imagePullSecrets: []
# -- Override the chart name in resource names.
nameOverride: ""
# -- Override the full resource name.
fullnameOverride: ""

# Logins. `root@'%'` is created with `rootPassword` on the first start of each server. Later
# changes to the password don't reach a running database: change it with `ALTER USER` and
# update the Secret too (the role labeler, `helm test` and the init Job use it).
auth:
  # -- Password of `root`. Generated when empty, and kept across upgrades. Ignored when `existingSecret` is set.
  rootPassword: ""
  # -- Database to create on install (and on upgrades, if it's missing). Empty: none.
  database: ""
  # -- Application user with all privileges on `database`. Empty: none.
  username: ""
  # -- Password of `username`. Generated when empty, and kept across upgrades. Set again on every upgrade, also when it comes from `existingSecret`.
  password: ""
  # -- Existing Secret with the passwords (recommended for production).
  existingSecret: ""
  # -- Key in `existingSecret` with the root password.
  rootPasswordKey: root-password
  # -- Key in `existingSecret` with the password of `username`.
  userPasswordKey: user-password

# -- sql-server [config.yaml](https://www.dolthub.com/docs/sql-reference/server/configuration/) settings, merged over the chart's defaults, e.g. `behavior`, `listener.max_connections`, `system_variables`, `listener.tls_cert`. The chart sets `data_dir`, `listener.host`/`port`, the `metrics` address and `cluster`.
config: {}
#  behavior:
#    dolt_transaction_commit: true
#  system_variables:
#    max_connections: 500

# -- Server log level: `trace`, `debug`, `info`, `warning`, `error` or `fatal`.
logLevel: info

# -- Send anonymous usage events to DoltHub (Dolt's own default). The chart turns this off.
usageMetrics: false

cluster:
  # -- Before a primary's pod stops (rolling update, node drain, `kubectl delete pod`), hand the primary role to a standby, so writes only pause for a few seconds.
  handoverOnShutdown: true
  # -- Seconds a rolling update waits after each restarted server is Ready before it stops the next one. Gives the primary time to bring the restarted standby up to date, so a handover doesn't pause writes for up to 10 s.
  minReadySeconds: 10
  # The role labeler is a sidecar (same image) that labels each pod with its current role,
  # `dolthub.com/cluster_role`, which the read-write Service selects.
  roleLabeler:
    # -- Seconds between role checks. A failover reaches the Service within this time.
    intervalSeconds: 2
    # -- Resources of the role labeler sidecar.
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        memory: 64Mi

# Volume for /var/lib/dolt: the databases, users and grants.
persistence:
  # -- Create a PersistentVolumeClaim per server. If false, an `emptyDir` is used and all data is lost when the pod is deleted.
  enabled: true
  # -- Storage class. Empty: the cluster default.
  storageClass: ""
  # -- Access modes of the claims.
  accessModes:
    - ReadWriteOnce
  # -- Size of each claim.
  size: 8Gi
  # -- Annotations for the claims.
  annotations: {}
  # -- Keep the claims when the release is uninstalled. Claims of servers removed by lowering `replicaCount` are always deleted (they would come back with stale data).
  retainOnUninstall: true

metrics:
  # -- Expose Prometheus metrics on port 11228 (connections, query durations, role and replication lag per database).
  enabled: false
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor (needs the monitoring.coreos.com CRDs).
    enabled: false
    # -- Scrape interval.
    interval: 30s
    # -- Extra labels, e.g. the label your Prometheus selects ServiceMonitors by.
    labels: {}

service:
  # -- Service type of the read-write and read Services.
  type: ClusterIP
  # -- Port of the read-write and read Services.
  port: 3306
  # -- Service annotations.
  annotations: {}

networkPolicy:
  # -- Create a NetworkPolicy: the replication port only accepts the release's own servers.
  enabled: false
  # -- Who may connect to port 3306, as NetworkPolicy `from` entries. Empty: anyone. The release's own pods are always allowed.
  allowedClients: []
  # - podSelector:
  #     matchLabels:
  #       app: my-app

init:
  # -- Resources of the Job that creates `auth.database` and `auth.username`.
  resources: {}

# -- Extra environment variables for the database container.
extraEnv: []
# -- Extra environment variables from Secrets or ConfigMaps.
extraEnvFrom: []
# -- Extra volumes, e.g. a Secret with TLS certificates for `config.listener.tls_cert`.
extraVolumes: []
# -- Extra volume mounts for the database container. Not inside /etc/dolt (the chart's config).
extraVolumeMounts: []

serviceAccount:
  # -- Create a ServiceAccount. Its token is only mounted into the role labeler.
  create: true
  # -- ServiceAccount name. Empty: the full resource name.
  name: ""
  # -- ServiceAccount annotations.
  annotations: {}

# -- Pod annotations.
podAnnotations: {}
# -- Pod labels.
podLabels: {}

# -- Pod security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# -- Container security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Resources of the database container.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

# -- Seconds to let the server shut down cleanly, including the primary's handover to a standby.
terminationGracePeriodSeconds: 60

# TCP probes on the MySQL port. Standbys accept connections too, so they are Ready.
probes:
  startup:
    # -- Startup probe period in seconds.
    periodSeconds: 2
    # -- Startup probe failures before the container is restarted (2 s × 150 = 5 minutes).
    failureThreshold: 150
  liveness:
    # -- Liveness probe period in seconds.
    periodSeconds: 10
    # -- Liveness probe failures before the container is restarted.
    failureThreshold: 6
  readiness:
    # -- Readiness probe period in seconds.
    periodSeconds: 5
    # -- Readiness probe failures before the pod is taken out of the Services.
    failureThreshold: 2

podDisruptionBudget:
  # -- Create a PodDisruptionBudget (`maxUnavailable: 1`) when `replicaCount` is greater than 1.
  enabled: true

# -- Spread servers across nodes: `soft` (preferred), `hard` (required) or `""` (off). Ignored when `affinity` is set.
podAntiAffinityPreset: soft

# -- Node selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity. Replaces `podAntiAffinityPreset`.
affinity: {}
# -- Topology spread constraints.
topologySpreadConstraints: []
# -- Priority class name.
priorityClassName: ""
