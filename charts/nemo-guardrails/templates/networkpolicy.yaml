{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nemo-guardrails.fullname" . }}
  labels:
    {{- include "nemo-guardrails.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nemo-guardrails.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      from:
        {{- if .Values.networkPolicy.allowFrom }}
        {{- toYaml .Values.networkPolicy.allowFrom | nindent 8 }}
        {{- else }}
        - podSelector:
            matchLabels:
              nemo-guardrails-client: "true"
        {{- end }}
{{- end }}
