apiVersion: v1
kind: Pod
metadata:
  name: {{ include "nemo-guardrails.fullname" . }}-test-api
  labels:
    {{- include "nemo-guardrails.labels" . | nindent 4 }}
    nemo-guardrails-client: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: test
      # The NeMo Guardrails image has Python, so no extra image is pulled.
      image: {{ include "nemo-guardrails.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - python
        - -c
        - |
          import json, sys, time, urllib.request
          base = "http://{{ include "nemo-guardrails.fullname" . }}:{{ .Values.service.port }}"
          for attempt in range(20):
              try:
                  health = json.load(urllib.request.urlopen(base + "/v1/health", timeout=5))
                  break
              except Exception as ex:
                  print("waiting:", ex); time.sleep(3)
          else:
              sys.exit("health check failed")
          configs = [c["id"] for c in json.load(urllib.request.urlopen(base + "/v1/rails/configs", timeout=10))]
          print("health:", health, "configs:", configs)
          if {{ include "nemo-guardrails.defaultConfigId" . | quote }} not in configs:
              sys.exit("default configuration {{ include "nemo-guardrails.defaultConfigId" . }} not served")
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
