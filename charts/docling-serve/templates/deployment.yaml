apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docling-serve.fullname" . }}
  labels:
    {{- include "docling-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "docling-serve.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/secret: {{ include "docling-serve.secretChecksum" . }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "docling-serve.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "docling-serve.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.models.download (not (include "docling-serve.rq" .)) }}
      initContainers:
        {{- include "docling-serve.modelsInit" (list . (include "docling-serve.image" .)) | nindent 8 }}
      {{- end }}
      containers:
        - name: docling-serve
          image: {{ include "docling-serve.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["docling-serve", "run"]
          ports:
            - name: http
              containerPort: 5001
              protocol: TCP
          env:
            - name: UVICORN_PORT
              value: "5001"
            - name: DOCLING_SERVE_ENABLE_UI
              value: {{ .Values.ui.enabled | toString | quote }}
            {{- if .Values.apiKey.enabled }}
            - name: DOCLING_SERVE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "docling-serve.apiKeySecretName" . }}
                  key: {{ include "docling-serve.apiKeySecretKey" . }}
            {{- end }}
            {{- include "docling-serve.commonEnv" . | nindent 12 }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "docling-serve.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "docling-serve.volumes" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
