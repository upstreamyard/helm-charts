{{- include "docling-serve.validate" . }}
{{- if include "docling-serve.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docling-serve.secretName" . }}
  labels:
    {{- include "docling-serve.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if include "docling-serve.createApiKey" . }}
  api-key: {{ include "docling-serve.apiKey" . | b64enc | quote }}
  {{- end }}
  {{- if include "docling-serve.createRedisUrl" . }}
  redis-url: {{ .Values.engine.rq.redisUrl | b64enc | quote }}
  {{- end }}
{{- end }}
