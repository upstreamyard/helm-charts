apiVersion: v2
name: docling-serve
description: Docling Serve Helm chart for Kubernetes. Document conversion API (PDF, DOCX, PPTX, HTML, images to Markdown and JSON) for RAG pipelines, with API key auth by default, scalable RQ workers on Redis, KEDA queue autoscaling, CPU and CUDA images and Prometheus metrics. Community chart by upstreamyard, not an official Docling chart.
