apiVersion: v1
kind: Pod
metadata:
  name: {{ include "discourse.fullname" . }}-test-status
  labels:
    {{- include "discourse.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: curl
      # The Discourse image already contains curl, so no extra image is pulled.
      image: {{ include "discourse.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["sh", "-c"]
      args:
        - |
          set -e
          base="http://{{ include "discourse.fullname" . }}:{{ .Values.service.port }}"
          test "$(curl -sf --retry 10 --retry-all-errors --retry-delay 3 "$base/srv/status")" = ok
          # The home page needs the database; on login-required forums it shows the login page.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' "$base/")
          case "$code" in 200|302) ;; *) echo "Home page returned $code"; exit 1 ;; esac
          echo "Discourse is up"
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
