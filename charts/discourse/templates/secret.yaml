{{- include "discourse.validate" . }}
{{- if include "discourse.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "discourse.fullname" . }}
  labels:
    {{- include "discourse.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "discourse.secretData" . | nindent 2 }}
{{- end }}
