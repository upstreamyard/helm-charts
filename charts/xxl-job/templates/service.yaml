apiVersion: v1
kind: Service
metadata:
  name: {{ include "xxl-job.fullname" . }}
  labels:
    {{- include "xxl-job.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "xxl-job.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin
