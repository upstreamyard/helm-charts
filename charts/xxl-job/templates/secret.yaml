{{- include "xxl-job.validate" . }}
{{- if include "xxl-job.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xxl-job.fullname" . }}
  labels:
    {{- include "xxl-job.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "xxl-job.secretData" . | nindent 2 }}
{{- end }}
