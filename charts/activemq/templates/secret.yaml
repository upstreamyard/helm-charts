{{- include "activemq.validate" . }}
{{- if include "activemq.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "activemq.secretName" . }}
  labels:
    {{- include "activemq.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.auth.existingSecret }}
  admin-password: {{ include "activemq.password" (list . "admin-password" .Values.auth.adminPassword) | b64enc | quote }}
  {{- if .Values.auth.appUser }}
  app-password: {{ include "activemq.password" (list . "app-password" .Values.auth.appPassword) | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if and (eq .Values.store.type "jdbc") .Values.jdbc.password (not .Values.jdbc.existingSecret) }}
  jdbc-password: {{ .Values.jdbc.password | b64enc | quote }}
  {{- end }}
{{- end }}
