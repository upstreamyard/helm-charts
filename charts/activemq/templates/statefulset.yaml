{{- include "activemq.validate" . }}
{{- $authSecret := default (include "activemq.secretName" .) .Values.auth.existingSecret }}
{{- $ha := include "activemq.ha" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "activemq.fullname" . }}
  labels:
    {{- include "activemq.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "activemq.headlessName" . }}
  # Brokers start together: a standby must not wait for the active broker.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "activemq.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "activemq.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "activemq.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: activemq
          image: {{ include "activemq.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ACTIVEMQ_ADMIN_USER
              value: {{ .Values.auth.adminUser | quote }}
            - name: ACTIVEMQ_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret }}
                  key: {{ ternary .Values.auth.adminPasswordKey "admin-password" (not (empty .Values.auth.existingSecret)) }}
            {{- if .Values.auth.appUser }}
            - name: ACTIVEMQ_APP_USER
              value: {{ .Values.auth.appUser | quote }}
            - name: ACTIVEMQ_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret }}
                  key: {{ ternary .Values.auth.appPasswordKey "app-password" (not (empty .Values.auth.existingSecret)) }}
            {{- end }}
            - name: ACTIVEMQ_TRANSPORTS
              value: {{ join "," .Values.transports | quote }}
            - name: ACTIVEMQ_PERSISTENCE
              value: {{ .Values.store.type | quote }}
            {{- if eq .Values.store.type "jdbc" }}
            - name: ACTIVEMQ_JDBC_URL
              value: {{ .Values.jdbc.url | quote }}
            - name: ACTIVEMQ_JDBC_USER
              value: {{ .Values.jdbc.user | quote }}
            - name: ACTIVEMQ_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.jdbc.existingSecret }}
                  name: {{ .Values.jdbc.existingSecret }}
                  key: {{ .Values.jdbc.existingSecretPasswordKey }}
                  {{- else }}
                  name: {{ include "activemq.secretName" . }}
                  key: jdbc-password
                  {{- end }}
            {{- with .Values.jdbc.driver }}
            - name: ACTIVEMQ_JDBC_DRIVER
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.broker.name }}
            - name: ACTIVEMQ_BROKER_NAME
              value: {{ . | quote }}
            {{- end }}
            - name: ACTIVEMQ_SCHEDULER_ENABLED
              value: {{ .Values.broker.scheduler | quote }}
            {{- with .Values.broker.storeLimit }}
            - name: ACTIVEMQ_STORE_LIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.broker.tempLimit }}
            - name: ACTIVEMQ_TEMP_LIMIT
              value: {{ . | quote }}
            {{- end }}
            - name: ACTIVEMQ_WEB_CONSOLE
              value: {{ .Values.webConsole.enabled | quote }}
            - name: ACTIVEMQ_METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- with .Values.memoryOpts }}
            - name: ACTIVEMQ_OPTS_MEMORY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.javaOpts }}
            - name: ACTIVEMQ_OPTS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- range .Values.transports }}
            - name: {{ . }}
              containerPort: {{ include "activemq.transportPort" . }}
            {{- end }}
            {{- if .Values.webConsole.enabled }}
            - name: console
              containerPort: 8161
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: 9404
            {{- end }}
          {{- if $ha }}
          # Master/slave: a standby never opens the broker port; broker-state accepts it.
          startupProbe:
            exec:
              command: ["broker-state"]
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            exec:
              command: ["broker-state"]
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["broker-state"]
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            timeoutSeconds: 5
          {{- else }}
          startupProbe:
            tcpSocket:
              port: {{ include "activemq.probePort" . }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            tcpSocket:
              port: {{ include "activemq.probePort" . }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: {{ include "activemq.probePort" . }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            timeoutSeconds: 5
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/activemq
            - name: tmp
              mountPath: /tmp
            {{- if or .Values.configFiles .Values.configSecrets }}
            - name: config
              mountPath: /etc/activemq
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if or .Values.configFiles .Values.configSecrets }}
        # configFiles and configSecrets together form /etc/activemq.
        - name: config
          projected:
            sources:
              {{- if .Values.configFiles }}
              - configMap:
                  name: {{ include "activemq.fullname" . }}-config
              {{- end }}
              {{- range .Values.configSecrets }}
              - secret:
                  name: {{ . }}
              {{- end }}
        {{- end }}
        {{- if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if and $ha .Values.podAntiAffinityPreset }}
      affinity:
        podAntiAffinity:
          {{- if eq .Values.podAntiAffinityPreset "hard" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "activemq.selectorLabels" . | nindent 18 }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "activemq.selectorLabels" . | nindent 20 }}
          {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
