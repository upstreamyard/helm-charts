{{- if .Values.metrics.serviceMonitor.enabled }}
# Scrapes every broker through the headless Service, standbys included
# (activemq_broker_slave and JVM metrics).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "activemq.fullname" . }}
  labels:
    {{- include "activemq.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "activemq.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: headless
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
