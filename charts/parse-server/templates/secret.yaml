{{- include "parse-server.validate" . }}
{{- if include "parse-server.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "parse-server.fullname" . }}
  labels:
    {{- include "parse-server.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "parse-server.secretData" . | nindent 2 }}
{{- end }}
