apiVersion: v1
kind: Pod
metadata:
  name: {{ include "parse-server.fullname" . }}-test-health
  labels:
    {{- include "parse-server.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: health
      # The Parse Server image already contains wget, so no extra image is pulled.
      image: {{ include "parse-server.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["sh", "-c"]
      args:
        - |
          set -e
          base="http://{{ include "parse-server.fullname" . }}:{{ .Values.service.port }}/parse"
          for i in $(seq 1 10); do
            wget -qO- "$base/health" | grep -q '"status":"ok"' && break
            sleep 3
          done
          wget -qO- "$base/health" | grep -q '"status":"ok"'
          # A query with the app ID reaches the database; 200 even when the class is empty.
          wget -qO- --header "X-Parse-Application-Id: {{ .Values.parse.appId }}" "$base/classes/_Role?limit=1" | grep -q '"results"'
          echo "Parse Server is up"
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
