apiVersion: v2
name: tigerbeetle
description: TigerBeetle Helm chart for Kubernetes. Fault-tolerant 3 or 6 replica TigerBeetle cluster (financial transactions database for double-entry accounting) on the official image, with safe replica recovery, non-root, Prometheus metrics and helm test. Community chart by upstreamyard, not an official TigerBeetle chart.
