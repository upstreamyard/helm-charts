apiVersion: v2
name: kvrocks
description: Apache Kvrocks Helm chart for Kubernetes. Redis-compatible key-value database on RocksDB (data on disk, not in RAM) with high availability through Redis Sentinel failover, a write endpoint that follows the master, password auth by default, Prometheus metrics and memory sized to the pod, on the official apache/kvrocks image. Community chart by upstreamyard, not an official Apache Kvrocks chart.
type: application
version: 0.1.3
appVersion: "2.17.0"
kubeVersion: ">=1.25.0-0"
home: https://github.com/upstreamyard/helm-charts/tree/main/charts/kvrocks
icon: https://upstreamyard.github.io/helm-charts/logo.png
sources:
  - https://github.com/upstreamyard/helm-charts
  - https://github.com/apache/kvrocks
keywords:
  - kvrocks
  - apache-kvrocks
  - redis
  - redis-compatible
  - redis-sentinel
  - rocksdb
  - key-value
  - database
  - high-availability
  - redis-alternative
maintainers:
  - name: upstreamyard
    url: https://github.com/upstreamyard
annotations:
  artifacthub.io/category: database
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: kvrocks
      image: apache/kvrocks:2.17.0
    - name: valkey
      image: valkey/valkey:9.0.6-alpine
    - name: haproxy
      image: haproxy:3.2.25-alpine
    - name: kvrocks-exporter
      image: kvrocks/kvrocks-exporter:1.0.11
  artifacthub.io/links: |
    - name: Apache Kvrocks
      url: https://github.com/apache/kvrocks
  artifacthub.io/signKey: |
    fingerprint: 9B416F989B7E6C65F7F3BFAE7689688B20EC7813
    url: https://upstreamyard.github.io/helm-charts/pgp_keys.asc
  artifacthub.io/changes: |
    - kind: changed
      description: Mention hardened and custom images in the support contact
