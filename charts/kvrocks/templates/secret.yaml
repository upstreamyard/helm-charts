{{- include "kvrocks.validate" . }}
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kvrocks.fullname" . }}
  labels:
    {{- include "kvrocks.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ include "kvrocks.password" . | b64enc | quote }}
{{- end }}
