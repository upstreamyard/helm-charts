apiVersion: v1
kind: Pod
metadata:
  name: {{ include "postal.fullname" . }}-test
  labels:
    {{- include "postal.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: test
      # The Postal image has bash and curl; using it avoids pulling another image.
      image: {{ include "postal.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args:
        - bash
        - -c
        - |
          set -eu
          web="http://{{ include "postal.componentName" (list . "web") }}:{{ .Values.web.service.port }}"
          host={{ .Values.postal.webHostname | quote }}

          # The login page is rendered by the full Rails app; the Host header must be postal.webHostname.
          code=$(curl -s -o /tmp/login.html -w '%{http_code}' --retry 10 --retry-connrefused --retry-delay 3 -H "Host: $host" "$web/login")
          [ "$code" = 200 ] || { echo "GET /login returned $code"; exit 1; }
          grep -qi "password" /tmp/login.html || { echo "/login is not the login page"; exit 1; }
          echo "Web interface serves the login page"

          # The signing key is loaded (public key published as a JWKS).
          curl -sf -H "Host: $host" "$web/.well-known/jwks.json" | grep -q '"kty":"RSA"' || { echo "JWKS missing"; exit 1; }
          echo "Signing key loaded"

          # The SMTP server greets and answers EHLO.
          {{- $smtpPort := (first .Values.smtp.service.ports).port }}
          for attempt in $(seq 1 10); do
            if exec 3<>/dev/tcp/{{ include "postal.componentName" (list . "smtp") }}/{{ $smtpPort }}; then break; fi
            echo "SMTP not reachable, retrying"; sleep 3
          done
          {{- if .Values.smtp.proxyProtocol }}
          # smtp.proxyProtocol is on: the server expects a PROXY header before it greets.
          printf 'PROXY TCP4 127.0.0.1 127.0.0.1 1 {{ $smtpPort }}\r\n' >&3
          {{- end }}
          read -r -t 10 banner <&3
          echo "Banner: $banner"
          case "$banner" in 220*) ;; *) echo "unexpected SMTP banner"; exit 1 ;; esac
          printf 'EHLO helm-test.example.com\r\n' >&3
          read -r -t 10 reply <&3
          case "$reply" in 250*) ;; *) echo "unexpected EHLO reply: $reply"; exit 1 ;; esac
          printf 'QUIT\r\n' >&3
          echo "SMTP server answers EHLO"
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
