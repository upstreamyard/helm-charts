{{- /* SMTP server for incoming mail and for apps sending through Postal; health server on 9091. */}}
{{ include "postal.deployment" (dict
  "root" .
  "component" "smtp"
  "replicas" .Values.smtp.replicaCount
  "command" (list "bundle" "exec" "ruby" "script/smtp_server.rb")
  "ports" (list
    (dict "name" "smtp" "containerPort" (int .Values.smtp.containerPort) "protocol" "TCP")
    (dict "name" "health" "containerPort" 9091 "protocol" "TCP"))
  "grace" .Values.smtp.terminationGracePeriodSeconds
  "probes" (dict
    "startupProbe" (include "postal.probe" .Values.smtp.startupProbe)
    "livenessProbe" (include "postal.probe" .Values.smtp.livenessProbe)
    "readinessProbe" (include "postal.probe" .Values.smtp.readinessProbe))
  "resources" .Values.smtp.resources) }}
