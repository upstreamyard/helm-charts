apiVersion: v1
kind: Service
metadata:
  name: {{ include "postal.componentName" (list . "web") }}
  labels:
    {{- include "postal.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "postal.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postal.componentName" (list . "smtp") }}
  labels:
    {{- include "postal.labels" . | nindent 4 }}
    app.kubernetes.io/component: smtp
  {{- with .Values.smtp.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.smtp.service.type }}
  {{- with .Values.smtp.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with .Values.smtp.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  ports:
    {{- range .Values.smtp.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: smtp
      protocol: TCP
      {{- with .nodePort }}
      nodePort: {{ . }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "postal.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: smtp
