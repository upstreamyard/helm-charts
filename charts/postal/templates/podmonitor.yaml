{{- if .Values.metrics.podMonitor.enabled }}
{{- /* The SMTP servers and workers serve Prometheus metrics on their health port; the web server has none. */}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "postal.fullname" . }}
  labels:
    {{- include "postal.labels" . | nindent 4 }}
    {{- with .Values.metrics.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "postal.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [smtp, worker]
  podMetricsEndpoints:
    - port: health
      path: /metrics
      interval: {{ .Values.metrics.podMonitor.interval }}
{{- end }}
